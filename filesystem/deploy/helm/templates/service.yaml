{{- if and (eq .Values.mode "standalone") .Values.events.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kv-cache-evictor.eventsServiceName" . }}
  labels:
    {{- include "kv-cache-evictor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.events.service.type }}
  ports:
    - name: events
      port: {{ .Values.events.service.port }}
      targetPort: events
      protocol: TCP
  selector:
    {{- include "kv-cache-evictor.selectorLabels" . | nindent 4 }}
{{- end }}
